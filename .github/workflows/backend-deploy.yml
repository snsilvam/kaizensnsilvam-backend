name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: kaizensnsilvam
  REGION: us-central1
  SERVICE: kaizensnsilvam-backend
  IMAGE: kaizensnsilvam-backend
  # Orígenes del frontend autorizados a llamar la API (CORS).
  # Se configura en GitHub → Settings → Secrets and variables → Actions → Variables.
  # Si la variable no existe llega vacía y el backend cae a sus orígenes por defecto.
  CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # 🔑 OIDC obligatorio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/778334880592/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-cloud-run@kaizensnsilvam.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/kaizensnsilvam/containers/kaizensnsilvam-backend:latest .

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/kaizensnsilvam/containers/kaizensnsilvam-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy kaizensnsilvam-backend \
            --image us-central1-docker.pkg.dev/kaizensnsilvam/containers/kaizensnsilvam-backend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "^;^GOOGLE_CLOUD_PROJECT=$PROJECT_ID;CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
