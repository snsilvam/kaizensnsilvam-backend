openapi: 3.0.3

info:
  title: Kaizen Backend API
  description: API REST del backend de finanzas personales Kaizen.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local

# Todas las rutas exigen un ID token de Firebase salvo las que declaran
# `security: []` (health y la propia documentación).
security:
  - bearerAuth: []

tags:
  - name: health
  - name: families
  - name: users
  - name: incomes
  - name: pending-payments
  - name: dashboard

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Servicio disponible

  /families:
    post:
      tags: [families]
      summary: Crea una familia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Familia creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /families/{id}:
    get:
      tags: [families]
      summary: Obtiene una familia por ID
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Familia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users:
    post:
      tags: [users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}:
    get:
      tags: [users]
      summary: Obtiene un usuario por ID
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /incomes:
    get:
      tags: [incomes]
      summary: Lista los ingresos del usuario autenticado
      description: >
        Devuelve únicamente los ingresos cuyo dueño es el UID del ID token.
        El dueño sale del token verificado: no hay parámetro para consultar los
        ingresos de otro usuario. Los ingresos anteriores a la introducción de
        userId no tienen dueño y no los devuelve nadie.
      responses:
        "200":
          description: Ingresos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  incomes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Income"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [incomes]
      summary: Registra un ingreso
      description: Caso de uso RegisterIncome. Persiste un nuevo ingreso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterIncomeRequest"
      responses:
        "201":
          description: Ingreso registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /incomes/{id}:
    delete:
      tags: [incomes]
      summary: Elimina un ingreso
      description: >
        Caso de uso DeleteIncome. Borra el documento de forma permanente: no es
        un cambio de estado y no se puede deshacer. Sólo opera sobre ingresos
        del usuario autenticado: si el id es de otro usuario, o de un registro
        sin dueño, responde 404 igual que si no existiera, para no revelar qué
        ids son válidos.
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Ingreso eliminado. Sin cuerpo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pending-payments:
    get:
      tags: [pending-payments]
      summary: Lista los pagos pendientes del usuario autenticado
      description: >
        Devuelve los pagos con paid == false cuyo dueño es el UID del ID token.
        El dueño sale del token verificado: no hay parámetro para consultar los
        pagos de otro usuario. Los pagos anteriores a la introducción de userId
        no tienen dueño y no los devuelve nadie.
      responses:
        "200":
          description: Pagos pendientes del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_payments:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/PendingPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [pending-payments]
      summary: Registra un pago pendiente
      description: Caso de uso RegisterPendingPayment. Persiste un nuevo pago pendiente con paid = false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPendingPaymentRequest"
      responses:
        "201":
          description: Pago pendiente registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /pending-payments/{id}:
    delete:
      tags: [pending-payments]
      summary: Elimina un pago pendiente
      description: >
        Caso de uso DeletePendingPayment. Borra el documento de forma
        permanente: no es un cambio de estado y no se puede deshacer. Sólo
        opera sobre pagos del usuario autenticado: si el id es de otro usuario,
        o de un registro sin dueño, responde 404 igual que si no existiera,
        para no revelar qué ids son válidos.
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Pago pendiente eliminado. Sin cuerpo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pending-payments/{id}/mark-as-paid:
    patch:
      tags: [pending-payments]
      summary: Marca un pago pendiente como pagado
      description: >
        Caso de uso MarkPendingPaymentAsPaid. Cambia paid a true sin eliminar el
        registro. Sólo opera sobre pagos del usuario autenticado: si el id es de
        otro usuario, o de un registro sin dueño, responde 404 igual que si no
        existiera, para no revelar qué ids son válidos.
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Pago pendiente marcado como pagado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /dashboard:
    get:
      tags: [dashboard]
      summary: Obtiene el dashboard financiero
      description: >
        Caso de uso GetDashboard. Vista agregada de solo lectura: no tiene
        colección propia, orquesta los repositorios de Income y PendingPayment.
        Responde cuánto se puede gastar hoy, cuándo llega el próximo ingreso
        y si el plan va bien o mal.

        La plata viene en dos números: availableToday es caja real (solo la
        mueve lo que ya entró o salió) y availableAfterCommitments es la
        proyección tras cubrir lo pendiente.
      responses:
        "200":
          description: Dashboard calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ID token de Firebase Authentication emitido al usuario en el frontend
        (`getIdToken()`). Se envía como `Authorization: Bearer <ID_TOKEN>` y el
        backend lo verifica con el Firebase Admin SDK.

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Falta el ID token de Firebase o no es válido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: income amount must be greater than zero

    CreateFamilyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Familia Silva

    Family:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Sergio
        email:
          type: string
          format: email
          example: s.silva@seeed.us

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    RegisterIncomeRequest:
      type: object
      required: [name, amount, date]
      properties:
        name:
          type: string
          example: Salario
        amount:
          type: integer
          format: int64
          description: Monto del ingreso. Debe ser mayor que cero.
          example: 250000
        date:
          type: string
          format: date-time
          description: Fecha del ingreso en formato RFC3339.
          example: "2026-08-01T00:00:00Z"

    Income:
      type: object
      properties:
        id:
          type: string
          example: 8f2c1a3b4d5e
        name:
          type: string
          example: Salario
        amount:
          type: integer
          format: int64
          example: 250000
        date:
          type: string
          format: date-time
          example: "2026-08-01T00:00:00Z"

    NextIncome:
      type: object
      description: Ingreso futuro más próximo.
      properties:
        name:
          type: string
          example: Salario
        amount:
          type: integer
          format: int64
          example: 250000
        date:
          type: string
          format: date-time
          example: "2026-08-15T00:00:00Z"
        daysRemaining:
          type: integer
          description: Días completos que faltan para el ingreso.
          example: 6

    RegisterPendingPaymentRequest:
      type: object
      required: [name, amount, dueDate]
      properties:
        name:
          type: string
          example: Internet
        amount:
          type: integer
          format: int64
          description: Monto del pago pendiente. Debe ser mayor que cero.
          example: 90000
        dueDate:
          type: string
          format: date-time
          description: Fecha de vencimiento en formato RFC3339.
          example: "2026-08-15T00:00:00Z"

    PendingPayment:
      type: object
      properties:
        id:
          type: string
          example: 8f2c1a3b4d5e
        name:
          type: string
          example: Internet
        amount:
          type: integer
          format: int64
          example: 90000
        dueDate:
          type: string
          format: date-time
          example: "2026-08-15T00:00:00Z"
        paid:
          type: boolean
          example: false

    DashboardPendingPayment:
      type: object
      description: >
        Proyección de un pago pendiente dentro del dashboard. No expone paid
        porque el dashboard solo lista los que están sin pagar.
      properties:
        id:
          type: string
          example: 7a1b2c3d4e5f
        name:
          type: string
          example: Arriendo
        amount:
          type: integer
          format: int64
          example: 100000
        dueDate:
          type: string
          format: date-time
          example: "2026-08-20T00:00:00Z"

    Dashboard:
      type: object
      properties:
        availableToday:
          type: integer
          format: int64
          description: >
            Caja real: ingresos ya recibidos (fecha de hoy o anterior) menos
            los pagos ya realizados (paid == true). Registrar un pago pendiente
            no la modifica; marcarlo como pagado la reduce.
          example: 270000
        availableAfterCommitments:
          type: integer
          format: int64
          description: >
            availableToday menos el total de pagos pendientes: lo que quedaría
            si hoy se cubrieran todos los compromisos. Puede ser negativo.
          example: 150000
        nextIncome:
          description: Próximo ingreso futuro, o null si no hay ninguno.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NextIncome"
        planStatus:
          type: string
          description: >
            Derivado de availableAfterCommitments. V1: on_track si es mayor que
            cero, at_risk en cualquier otro caso.
          enum: [on_track, at_risk]
          example: on_track
        pendingPayments:
          type: array
          description: Pagos con paid == false, ordenados por vencimiento.
          items:
            $ref: "#/components/schemas/DashboardPendingPayment"
        pendingPaymentsCount:
          type: integer
          example: 2
